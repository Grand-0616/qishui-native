name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q core ui app.py build.py make_icon.py

      - name: 打包 exe（PyInstaller onedir）
        run: python build.py --clean

      - name: 启动自检
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/QishuiNative/QishuiNative.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "dist/QishuiNative/data/selftest.txt") { Get-Content "dist/QishuiNative/data/selftest.txt" }
          if ($p.ExitCode -ne 0) { throw "selftest 失败，退出码 $($p.ExitCode)" }

      - name: 上传 exe 目录
        uses: actions/upload-artifact@v4
        with:
          name: QishuiNative-win64
          path: dist/QishuiNative/
          retention-days: 14

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 生成安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\installer.iss"
          Get-ChildItem installer\output | Select-Object Name, Length

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: QishuiNative-Setup
          path: installer/output/*.exe
          retention-days: 14

      - name: 打 tag 时自动建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          generate_release_notes: true
